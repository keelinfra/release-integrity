name: test
on:
  pull_request:
    paths: ["scan.py", "tests/**", ".github/workflows/test.yml"]
  push:
    branches: [main]
    paths: ["scan.py", "tests/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 -m unittest discover -s tests -v
